<form id="contact" class="form-card" method="post" action="https://formspree.io/f/xrgrgegb">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required autocomplete="name"
           pattern="[A-Za-z'\-\s]+" title="Please use only letters, spaces, hyphens and apostrophes">
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email">
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea rows="5" id="message" name="message" required></textarea>
  </div>
  <input type="submit" name="submit" value="Send message">
</form>
